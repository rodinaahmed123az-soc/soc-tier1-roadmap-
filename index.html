<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rodina Ahmed | SOC Tier 1 Roadmap</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg-deep: #050811;
  --card-bg: rgba(13, 21, 39, 0.85);
  --text-main: #FFFFFF;
  --text-muted: #94A3B8;
  --border-color: #1a233a;
  --green-accent: #00ff88;
  --cyan-accent: #00E5FF;
  --font-family: 'Cairo', sans-serif;
}

.light {
  --bg-deep: #F8FAFC;
  --card-bg: rgba(255, 255, 255, 0.9);
  --text-main: #111827;
  --text-muted: #475569;
  --border-color: #E2E8F0;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: var(--font-family);
}

/* --- التنسيقات الخاصة بميزة تتبع التقدم --- */
.progress-container {
  max-width: 800px;
  margin: 20px auto;
  padding: 0 20px;
  text-align: center;
}

.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-size: 0.95rem;
  color: var(--text-muted);
}

.progress-bar-bg {
  width: 100%;
  height: 10px;
  background-color: var(--border-color);
  border-radius: 10px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--cyan-accent), var(--green-accent));
  transition: width 0.4s ease;
}

.reset-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.85rem;
  margin-top: 8px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.reset-btn:hover {
  color: #ff4d4d;
}

.complete-btn {
  background: transparent;
  border: 1px solid var(--green-accent);
  color: var(--green-accent);
  padding: 6px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
  font-size: 0.85rem;
  transition: all 0.3s ease;
  margin-top: 15px;
}

.complete-btn.completed {
  background-color: var(--green-accent);
  color: var(--bg-deep);
}
</style>
</head>
<body>

  <!-- شريط التقدم وزر إعادة التعيين -->
  <div class="progress-container">
    <div class="progress-header">
      <span id="stage-counter">0 / 8 مراحل</span>
      <span>تقدمك في الـ Roadmap</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar-fill"></div>
    </div>
    <button class="reset-btn" onclick="resetProgress()">
      <i class="fas fa-undo"></i> إعادة تعيين
    </button>
  </div>

  <!-- كود JavaScript الخاص بتشغيل الميزة وحفظ البيانات -->
  <script>
    const TOTAL_STAGES = 8; // يمكنك تغيير عدد المراحل هنا حسب الحاجة

    document.addEventListener('DOMContentLoaded', () => {
        updateUI();
    });

    function toggleStage(stageId) {
        let completed = JSON.parse(localStorage.getItem('completed_stages')) || [];
        
        if (completed.includes(stageId)) {
            completed = completed.filter(id => id !== stageId);
        } else {
            completed.push(stageId);
        }

        localStorage.setItem('completed_stages', JSON.stringify(completed));
        updateUI();
    }

    function updateUI() {
        const completed = JSON.parse(localStorage.getItem('completed_stages')) || [];
        const count = completed.length;

        // تحديث العداد والنص
        const counterElem = document.getElementById('stage-counter');
        const fillElem = document.getElementById('progress-bar-fill');
        
        if (counterElem) counterElem.innerText = `${count} / ${TOTAL_STAGES} مراحل`;
        if (fillElem) fillElem.style.width = `${(count / TOTAL_STAGES) * 100}%`;

        // تحديث حالة الأزرار في الكروت
        document.querySelectorAll('.stage-card').forEach(card => {
            const stageId = parseInt(card.getAttribute('data-stage-id'));
            const btn = card.querySelector('.complete-btn');
            
            if (btn) {
                if (completed.includes(stageId)) {
                    btn.classList.add('completed');
                    btn.innerText = '✓ مكتملة';
                } else {
                    btn.classList.remove('completed');
                    btn.innerText = 'مكتملة';
                }
            }
        });
    }

    function resetProgress() {
        if (confirm('هل أنتِ متأكدة من إعادة تعيين التقدم؟')) {
            localStorage.removeItem('completed_stages');
            updateUI();
        }
    }
  </script>
</body>
</html>
