<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rodina Ahmed | SOC Tier 1 Roadmap</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
--bg:#080c14;
--card:#111827;
--text:#fff;
--muted:#94a3b8;
--border:#263244;
--green:#00ff88;
--blue:#00b8ff;
}

.light{
--bg:#f8fafc;
--card:#ffffff;
--text:#111827;
--muted:#475569;
--border:#cbd5e1;
--green:#059669;
}


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
scroll-behavior:smooth;
}


body{
background:var(--bg);
color:var(--text);
transition:.4s;
}


nav{
position:fixed;
top:0;
width:100%;
z-index:1000;
background:rgba(8,12,20,.85);
backdrop-filter:blur(15px);
border-bottom:1px solid var(--border);
}


.nav-container{

max-width:1200px;
margin:auto;
padding:15px 25px;

display:flex;
justify-content:space-between;
align-items:center;

}


.logo{

color:var(--text);
text-decoration:none;
font-size:1.3rem;
font-weight:800;

}


.logo span{
color:var(--green);
}



.actions{

display:flex;
gap:10px;

}


button{

cursor:pointer;

background:var(--card);
color:var(--text);

border:1px solid var(--border);

padding:8px 14px;

border-radius:8px;

transition:.3s;

}


button:hover{

border-color:var(--green);
color:var(--green);

}



.hero{

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

padding:100px 20px;

}


.profile{

width:160px;
height:160px;

margin:auto;

border-radius:50%;

padding:5px;

background:linear-gradient(
45deg,
var(--green),
var(--blue)
);

}


.profile img{

width:100%;
height:100%;

border-radius:50%;

object-fit:cover;

}



h1{

font-size:2.8rem;
margin-top:25px;

}


.subtitle{

color:var(--green);

font-size:1.3rem;

font-weight:bold;

}


.tags{

color:var(--muted);

margin:15px;

}



.btn{

display:inline-block;

background:var(--green);

color:#000;

padding:12px 25px;

border-radius:10px;

text-decoration:none;

font-weight:bold;

transition:.3s;

}


.btn:hover{

transform:translateY(-3px);

}



section{

max-width:1100px;

margin:auto;

padding:70px 20px;

}



.title{

text-align:center;

font-size:2rem;

margin-bottom:40px;

}



.card{

background:var(--card);

border:1px solid var(--border);

border-radius:15px;

padding:25px;

margin-bottom:20px;

transition:.4s;

}


.card:hover{

transform:translateY(-5px);

border-color:var(--green);

}



.links{

display:flex;

flex-wrap:wrap;

gap:10px;

margin-top:20px;

}



footer{

text-align:center;

padding:30px;

border-top:1px solid var(--border);

color:var(--muted);

}



@media(max-width:700px){

h1{
font-size:2rem;
}

}

</style>

</head>


<body>


<nav>

<div class="nav-container">


<a href="#" class="logo">
🛡 <span>Rodina Ahmed</span>

<div class="actions">

🌐 عربي / English
</button>


<button onclick="toggleTheme()">

</button>

</div>

<p class="tags">

</p>

<a href="#roadmap" class="btn">
🚀 ابدأ الرحلة
</a>

</div>

<p>

Rodina Ahmed

</p>

Created by <b>Rodina Ahmed</b><br>

<script>

const stages=[

{
name:"Stage 0 — Networking Fundamentals",
links:[
["📘 Network+","https://m.youtube.com/playlist?list=PLLlr6jKKdyK1zEvFvbRefQSngzxoYGID1&ra=m"],
["🌐 CCNA","https://m.youtube.com/playlist?list=PLAqaqJU4wzYU_6EIzVoxHghQILgyY--yf&ra=m"]
]
},

{
name:"Stage 1 — Windows Administration",
links:[
["🪟 MCSA","https://m.youtube.com/playlist?list=PLped9VG7STA9vZFYwVIIbnSdfu8gKUpm2&ra=m"]
]
},

{
name:"Stage 2 — Linux Fundamentals",
links:[
["🐧 Linux","https://youtube.com/playlist?list=PLDRMxi70CdSD48OPJbsDZRt4l0GvWJ2iG&si=ExBdy34J9uO39SJY"]
]
},

{
name:"Stage 3 — Cyber Security Fundamentals",
links:[
["🔐 Security+","https://youtube.com/playlist?list=PLky4bd7_03m8o1NB0j96OsxZs0KcKlgMO&si=brYNqyjcsp26MNjy"]
]
},

{
name:"Stage 4 — Hands-on Labs",
links:[
["🚀 TryHackMe","https://tryhackme.com/"],
["🛡 LetsDefend","https://letsdefend.io/"],
["🔎 CyberDefenders","https://cyberdefenders.org/"]
]
},

{
name:"Stage 5 — SIEM & Splunk",
links:[
["📊 Splunk Training","https://www.splunk.com/en_us/training.html"],
["🕵 BOTS v1","https://github.com/splunk/botsv1"],
["🕵 BOTS v2","https://github.com/splunk/botsv2"],
["🕵 BOTS v3","https://github.com/splunk/botsv3"]
]
},

{
name:"Stage 6 — Python for Cyber Security",
links:[
["🐍 Python","https://youtube.com/playlist?list=PLDoPjvoNmBAyE_gei5d18qkfIe-Z8mocs&si=05I4omfh9Djp8WSD"]
]
},

{
name:"Stage 7 — Incident Response & Career Preparation",
links:[
["🚨 eCIR Course","https://netriders.academy/all-courses/incident-response/"],
["📚 SOC Notes","https://drive.google.com/file/d/1WwARR5WFuhm2Xt1mi3gCJIFWDNwKqUhV/view"],
["🎯 Interview Questions","https://drive.google.com/file/d/1jsVA3FY_z7kdCBdWEsJ2ofAxTELo_gHy/view"]
]
}

];



const roadmap=document.getElementById("roadmap");


stages.forEach(stage=>{

let card=document.createElement("div");

card.className="card";


card.innerHTML=`

<h3 style="color:var(--green)">
${stage.name}
</h3>

<div class="links">

${stage.links.map(x=>`

<a class="btn"
target="_blank"
href="${x[1]}">

${x[0]}

</a>

`).join("")}

</div>

`;

roadmap.appendChild(card);

});




// Dark / Light

function toggleTheme(){

document.body.classList.toggle("light");

localStorage.setItem(
"theme",
document.body.classList.contains("light")?"light":"dark"
);

}


if(localStorage.getItem("theme")=="light"){
document.body.classList.add("light");
}




// Language

let lang="ar";


function changeLanguage(){

lang=lang==="ar"?"en":"ar";

document.documentElement.dir=
lang==="ar"?"rtl":"ltr";


document.querySelectorAll("[data-ar]")
.forEach(e=>{

e.innerText=
lang==="ar"
?e.dataset.ar
:e.dataset.en;

});

}


</script>


</body>
